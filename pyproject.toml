[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmon"
version = "0.1.0"
description = "A lightweight CPU, memory and swap indicator for the Ubuntu top bar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jan Rock", email = "rock@linux.com" }]

# PyGObject is intentionally not listed here: on Debian/Ubuntu it must
# come from apt (python3-gi + the gir1.2-* typelibs) to match the
# system GTK/AppIndicator libraries. See README.md "Local development"
# for the one-line apt install.
dependencies = []

[project.scripts]
rmon = "rmon.app:main"

[tool.setuptools]
packages = ["rmon"]
